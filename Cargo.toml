[package]
name = "argent"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge autonomous coding agent with WASM sandboxing"
authors = ["Argent Team"]

[dependencies]
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ring = "0.17"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
dirs = "5"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
wasmtime = { version = "22", package = "wasmtime" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true