name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint (clippy, the Makefile bar)
        run: cargo clippy -- -D warnings

      - name: Unit tests (main crate)
        run: cargo test

      - name: Integration tests (FullIntegrationTest crate)
        working-directory: FullIntegrationTest
        run: cargo test
