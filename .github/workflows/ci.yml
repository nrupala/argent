name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (linter)
        run: cargo clippy --all-targets

      - name: Unit tests (main crate)
        run: cargo test

      - name: Integration tests (FullIntegrationTest workspace)
        run: cargo test --manifest-path FullIntegrationTest/Cargo.toml
